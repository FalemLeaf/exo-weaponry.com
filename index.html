<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" maximum-scale=1.0, user-scalable=no">
    <title>Exo Weaponry</title>
    <link rel="stylesheet" href="Styles/Fonts.css">
    <link rel="stylesheet" href="Styles/MainCSS.css">
    <link rel="icon" type="image/png" href="Assets/Icons/favicon.png">
</head>
<body>
    <img class="bgGrid" src="Assets/Imgs/BgGrid.png" alt="background Grid">
    <div class="HomeBg">
        <video autoplay muted loop playsinline poster="Assets/Imgs/Home/home-BG.png" id="bg-video">
            <source src="Assets/Vids/HomeBG.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <div class="nav">
        <div class="rightNavCont">
            <div class="rightNav">
                <img id="logo" src="Assets/Imgs/Home/mod-header-logo.png" alt="logo">
                <p>Web Version 0.0.2</p>
            </div>
            <div class="searchBar">
                <span class="searchIcon"></span>
                <input type="text" placeholder="Search...">
            </div>
        </div>
        <div class="leftNav">
            <div class="navButton">
                <div>
                    <span class="modeIcon">Dark</span>
                    <p>Dark</p>
                </div>
                <span class="arrowDIcon"></span>
            </div>
            <div class="navButton">
                <div>
                    <span class="supIcon">Support</span>
                    <p>Support</p>
                </div>
                <span class="arrowDIcon"></span>
            </div>
        </div>
    </div>
    <div class="contentBody">
        <div class="header">
            <div class="head">
                <img id="headerLogo" src="Assets/Imgs/Home/mod-header-logo.png" alt="Mod-logo">
                <div class="subtitle">
                    <h1>Make your progression better. Forge, equip and ascend your weapon through the course of your journey.</h1>
                </div>
            </div>
            <div class="dlCont">
                <div class="dlButton">
                    <a target="_blank" href="https://www.curseforge.com/hytale/mods/fls-exotic-weaponry">DOWNLOAD</a>
                </div>
            </div>
        </div>
        <img class="divider" src="Assets/Imgs/Divider.png" alt="divider">
        <div class="overview">
            <div class="magiCircle">
                <img class="center" src="Assets/Imgs/Home/magic-circle/Center-star.png" alt="center-star">
                <img class="in1" src="Assets/Imgs/Home/magic-circle/Inner-circle.png" alt="center-star">
                <img class="in2" src="Assets/Imgs/Home/magic-circle/Inner-square-circle.png" alt="center-star">
                <img class="mid" src="Assets/Imgs/Home/magic-circle/Middle-sqaure-circle.png" alt="center-star">
                <img class="out1" src="Assets/Imgs/Home/magic-circle/Outer-star.png" alt="center-star">
                <img class="out2" src="Assets/Imgs/Home/magic-circle/Outer-square-cicle.png" alt="center-star">
            </div>
            <div class="cardSelection">
                <div class="card">
                    <div class="cardLeft">
                        <div class="cardDinfo">
                            <h1 class="cardTitle">WEAPONS</h1>
                            <p class="cardDesc">Explore every weaponry in the mod</p>
                        </div>
                        <div class="cardBottom">
                            <p class="cardButton">Click Here to Explore</p>
                            <span class="arrowR">arrowR</span>
                        </div>
                    </div>
                    <div class="cardRight">

                    </div>
                </div>
                <div class="card">

                </div>
            </div>
        </div>
    </div>
    <div class="footer">

    </div>
</body>
</html>
